<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a2b"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Candles -->
  <g stroke-linecap="round">
    <line x1="150" y1="250" x2="150" y2="360" stroke="#ef4444" stroke-width="10"/>
    <rect x="132" y="270" width="36" height="66" rx="6" fill="#ef4444"/>
    <line x1="256" y1="190" x2="256" y2="330" stroke="#34d399" stroke-width="10"/>
    <rect x="238" y="214" width="36" height="88" rx="6" fill="#34d399"/>
    <line x1="362" y1="130" x2="362" y2="270" stroke="#34d399" stroke-width="10"/>
    <rect x="344" y="150" width="36" height="92" rx="6" fill="#34d399"/>
  </g>
  <!-- Trend line -->
  <polyline points="110,390 210,320 300,300 410,170" fill="none" stroke="url(#line)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
